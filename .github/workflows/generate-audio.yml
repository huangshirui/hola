name: Generate Spanish audio

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_audio.py
      - dist/people-content.js
      - tests/test_audio.py
      - .github/workflows/generate-audio.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-spanish-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for classroom phrase extraction
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify classroom exercises and audio generator
        run: |
          node --test tests/classroom.test.cjs
          python -m unittest discover -s tests -p 'test_audio.py'

      - name: Generate fixed es-ES audio with Azure Speech
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python scripts/generate_audio.py

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/audio
          if git diff --cached --quiet; then
            echo "No generated audio changes."
            exit 0
          fi
          git commit -m "chore: generate fixed Spanish audio"
          git push
