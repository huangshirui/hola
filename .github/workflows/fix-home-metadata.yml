name: Fix home topic metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-home-metadata.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update home topic metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dist/app.js')
          text = path.read_text(encoding='utf-8')

          old_badge = '<span class="pill">第 4–6 周</span>'
          new_badge = '<span class="pill">本期主题 · 入门</span>'
          old_note = '<p class="next-note">数字主题含电话号码听力与课堂拓展：看图数物 · uno / un / una。</p>'

          if old_badge not in text:
              raise SystemExit('Expected week badge was not found')
          if old_note not in text:
              raise SystemExit('Expected numeric-topic note was not found')

          text = text.replace(old_badge, new_badge, 1)
          text = text.replace(old_note, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify classroom tests
        run: node --test tests/classroom.test.cjs

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/app.js
          git rm .github/workflows/fix-home-metadata.yml
          git commit -m "fix: clean up home topic metadata"
          git push
